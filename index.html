<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Title, description and the search/preview tags are written per language at build time (build/pages.ts). -->
    <title>免費線上節拍器｜指揮拍式圖、重音、細分拍，可離線使用</title>
    <meta name="description" content="" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#172036" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/pwa-192x192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-title" content="節拍器" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1 class="brand">
          <img class="brand-mark" src="/pwa-64x64.png" srcset="/pwa-64x64.png 1x, /pwa-192x192.png 3x" width="28" height="28" alt="" />
          <span data-i18n="appTitle">節拍器</span>
        </h1>
        <div class="topbar-actions">
          <button id="install" class="text-button" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14" /></svg>
            <span data-i18n="install">安裝 App</span>
          </button>
          <nav class="language" data-i18n-label="language" aria-label="語言">
            <a href="./" data-language="zh-Hant" hreflang="zh-Hant" lang="zh-Hant">中文</a>
            <a href="./en/" data-language="en" hreflang="en" lang="en">EN</a>
          </nav>
        </div>
      </header>

      <main class="layout">
        <section class="stage">
          <figure class="pattern-figure">
            <div id="pattern" class="pattern">
              <div id="beat-buttons" class="beat-buttons" role="group" data-i18n-label="beatsGroup" aria-label="小節拍點"></div>
            </div>
            <figcaption class="caption">
              <span class="meter" role="group" data-i18n-label="beats" aria-label="拍數">
                <button id="fewer-beats" class="step small" type="button" data-i18n-label="fewerBeats" aria-label="減少拍數">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
                </button>
                <span class="time-signature" aria-hidden="true"><span id="caption-beats">4</span><span>4</span></span>
                <output id="beats-value" class="sr-only" aria-live="polite">4</output>
                <button id="more-beats" class="step small" type="button" data-i18n-label="moreBeats" aria-label="增加拍數">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12" /></svg>
                </button>
              </span>
              <span id="hint" class="hint" data-i18n="accentHint">點數字切換：重音 → 一般 → 靜音</span>
            </figcaption>
          </figure>

          <div id="tempo" class="tempo">
            <button id="slower" class="step" type="button" data-i18n-label="slower" data-i18n-title="slowerTitle" aria-label="減慢" aria-keyshortcuts="ArrowDown Shift+ArrowDown">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
            </button>
            <p class="tempo-mark">
              <span class="marking">
                <span id="marking">Allegro</span>
                <!-- While the speed trainer is on: where it is taking the tempo, as a score marks it. -->
                <span id="direction" class="direction" hidden>
                  <span class="direction-line" aria-hidden="true">
                    <span id="direction-change" class="direction-change">accel.</span>
                    <span class="direction-arrow">→</span>
                    <span class="direction-mark"><span class="mark-note">&#xECA5;</span><span class="mark-equals">=</span><span id="direction-target">160</span></span>
                    <span id="direction-rule" class="direction-rule"></span>
                  </span>
                  <span id="direction-text" class="sr-only"></span>
                </span>
              </span>
              <span class="metronome-mark">
                <span class="mark-note" aria-hidden="true">&#xECA5;</span>
                <span class="mark-equals" aria-hidden="true">=</span>
                <output id="bpm" class="bpm" for="bpm-slider">120</output>
                <span class="sr-only">BPM</span>
              </span>
            </p>
            <button id="faster" class="step" type="button" data-i18n-label="faster" data-i18n-title="fasterTitle" aria-label="加快" aria-keyshortcuts="ArrowUp Shift+ArrowUp">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14" /></svg>
            </button>
          </div>

          <div class="ruler">
            <input id="bpm-slider" class="slider" type="range" min="20" max="300" step="1" value="120" data-i18n-label="tempo" aria-label="速度" />
            <div id="ruler-scale" class="ruler-scale" aria-hidden="true"></div>
            <!-- The speed trainer's target, pencilled on the scale where the weight is heading. -->
            <div class="ruler-track" aria-hidden="true"><span id="ruler-target" class="ruler-target" hidden></span></div>
          </div>

          <div class="transport">
            <button id="tap" class="secondary" type="button" data-i18n-title="tapTitle" aria-keyshortcuts="T">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.9-2.6L4.2 15a1.6 1.6 0 0 1 2.5-2L9 15" />
              </svg>
              <span data-i18n="tap">打拍</span>
            </button>
            <button id="play" class="primary" type="button" data-i18n-title="playTitle" aria-keyshortcuts="Space">
              <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5.2v13.6L18.6 12z" /></svg>
              <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.2" y="6.2" width="11.6" height="11.6" rx="1.6" /></svg>
              <span id="play-label" data-i18n="play">開始</span>
            </button>
            <button id="trainer-toggle" class="secondary" type="button" aria-pressed="false" data-i18n-label="trainerToggle">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17.5 9 12l4 4 7.5-7.5m0 0H15m5.5 0V14" /></svg>
              <span data-i18n="trainerShort">加速</span>
            </button>
          </div>
        </section>

        <section class="settings">
          <div class="row">
            <span id="subdivision-label" class="label" data-i18n="subdivision">細分拍</span>
            <div id="subdivisions" class="segmented" role="radiogroup" aria-labelledby="subdivision-label"></div>
          </div>

          <div class="row">
            <label class="label" for="sound" data-i18n="sound">音色</label>
            <select id="sound" class="select"></select>
          </div>

          <div class="row">
            <label class="label" for="volume" data-i18n="volume">音量</label>
            <input id="volume" class="slider" type="range" min="0" max="100" step="1" value="80" />
          </div>

          <div class="trainer" role="group" aria-labelledby="trainer-label">
            <div class="trainer-head">
              <span id="trainer-label" class="label" data-i18n="trainer">加速練習</span>
              <button id="trainer-switch" class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="trainer-label"></button>
            </div>
            <div class="trainer-grid">
              <label>
                <span data-i18n="trainerStep">每次調整（BPM）</span>
                <input id="trainer-step" type="number" inputmode="numeric" min="1" max="50" step="1" />
              </label>
              <label>
                <span data-i18n="trainerEvery">每幾小節</span>
                <input id="trainer-every" type="number" inputmode="numeric" min="1" max="64" step="1" />
              </label>
              <label>
                <span data-i18n="trainerTarget">目標速度（BPM）</span>
                <input id="trainer-target" type="number" inputmode="numeric" min="20" max="300" step="1" />
              </label>
            </div>
            <p class="note" data-i18n="trainerHint"></p>
          </div>

          <p class="support">
            <a href="https://buymeacoffee.com/sychen6192" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.5h11v4.5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zm11 1.5h1.25a2.5 2.5 0 0 1 0 5H15.3M8.5 3.5v2.5m3.5-2.5v2.5" /></svg>
              <span data-i18n="support">請我喝杯咖啡</span>
            </a>
          </p>
        </section>
      </main>
    </div>

    <!-- Status messages, never part of a search result snippet. -->
    <div id="toast" class="toast" role="status" data-nosnippet hidden>
      <span id="toast-text"></span>
      <button id="toast-action" class="toast-action" type="button" hidden></button>
      <button id="toast-close" class="toast-close" type="button" data-i18n-label="dismiss" aria-label="關閉">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </div>
  </body>
</html>
